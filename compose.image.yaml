# Standalone deployment: this file needs no source checkout or Dockerfile.
# On the Linux appliance, export its UUID before starting:
# export MOVER_APPLIANCE_UUID="$(cat /sys/class/dmi/id/product_uuid)"
services:
  mover:
    image: "${MOVER_IMAGE:-ghcr.io/pokys/esxi-mover:latest}"
    platform: linux/amd64
    pull_policy: always
    ports:
      - "${MOVER_BIND_ADDRESS:-0.0.0.0}:8443:8443"
    environment:
      MOVER_APPLIANCE_UUID: "${MOVER_APPLIANCE_UUID:-}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: "no"
    logging:
      driver: none
